name: Release

on:
  push:
    tags:
      # Ordered GitHub negative filters: match stable vMAJOR.MINOR.PATCH tags, then
      # exclude prerelease (v1.2.3-rc.1) and build-metadata (v1.2.3+build.7) tags, and the
      # floating major alias (v1) the published action uses for routine maintenance.
      # In GitHub's filter syntax `+` is a quantifier ("one or more of the preceding
      # character") and `*+` is a hard parse error that invalidates the whole workflow, so
      # the literal plus is escaped. tests/test_release_tag_policy.py models this syntax.
      - "v*.*.*"
      - "!v*.*.*-*"
      - '!v*.*.*\+*'
      - "!v1"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, for example v0.3.0"
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Tag pushes bypass branch protection on main, so the publish step is gated
    # behind an environment with a required reviewer instead.
    environment: release
    permissions:
      contents: write # create the GitHub release
      id-token: write # OIDC for build provenance
      attestations: write # record the provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Resolve and validate release tag
        id: tag
        # ${{ }} expressions are NEVER interpolated straight into run: scripts -- a crafted
        # workflow_dispatch input would be substituted into the shell before any check could
        # reject it. Cross the boundary via env, then validate with a strict regex.
        env:
          INPUT_TAG: ${{ inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
          else
            tag="$GITHUB_REF_NAME"
          fi
          # The anchored match below is LINE-oriented, so it succeeds when ANY line matches
          # and an embedded newline ("v1.2.3" then "v9.9.9") would slip through it. git
          # forbids control characters in refnames, so a tag push cannot carry one, but
          # workflow_dispatch input is free-form. Reject anything outside the SemVer
          # character set first, which is what makes the anchored match sound.
          case "$tag" in
            *[!0-9A-Za-z.+-]*)
              echo "refusing tag '$tag': characters outside [0-9A-Za-z.+-]" >&2
              exit 1 ;;
          esac
          # Stable-only exact vMAJOR.MINOR.PATCH with no leading zeroes. Prerelease/build
          # tags (v1.2.3-rc.1, v1.2.3+build.7) and floating aliases (v1) never release.
          if ! printf '%s' "$tag" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "refusing tag '$tag': only exact stable vMAJOR.MINOR.PATCH tags release" >&2
            exit 1
          fi
          git rev-parse --verify "refs/tags/$tag" >/dev/null
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Validate tag against release matrix
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # The tag must equal the selected package version recorded in release/versions.json
          # (validates the current tree with --check-published: fetched origin/main,
          # selection-base object, tags, eligibility, and current-tree parity).
          git fetch --quiet --tags origin main
          python3 scripts/check_release_versions.py --check-published --tag "$TAG"
      - name: Verify tag is reachable from main and check it out
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # Without this, any v* tag on an arbitrary commit -- one that never passed the
          # required `test` / `readiness` checks on main -- would publish a release.
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "refs/tags/$TAG^{commit}" origin/main; then
            echo "refusing to release $TAG: commit is not an ancestor of origin/main" >&2
            exit 1
          fi
          # On workflow_dispatch, checkout landed on the dispatch ref (main), not the tag.
          # Detach onto the tag so verification below exercises the exact tree that
          # `git archive` ships, rather than whatever main happens to contain.
          git checkout --quiet --detach "refs/tags/$TAG"
          git --no-pager log -1 --format='releasing %H (%d)'
      - name: Verify release readiness
        run: |
          python3 -m unittest discover -s tests -t .
          python3 scripts/vendor.py --check
          python3 -m evals.criterion_benchmark --validate evals/criterion_labels.json
          python3 -m evals.fixtures
          python3 -m evals.parity
      - name: Build source archive
        id: build
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          mkdir -p dist
          name="ready-agent-1-${TAG#v}.tar.gz"
          git archive --format=tar.gz --prefix="ready-agent-1-${TAG#v}/" "refs/tags/$TAG" -o "dist/$name"
          # Run shasum from inside dist/ so the sidecar names the bare file: a consumer who
          # downloads both assets into one directory can `shasum -a 256 -c` as-is. (The
          # v0.11.0 sidecar embeds `dist/`, so it only verifies from the parent of a dist/.)
          (cd dist && shasum -a 256 "$name" > "$name.sha256")
          echo "archive=dist/$name" >> "$GITHUB_OUTPUT"
      - name: Extract release notes from CHANGELOG
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # The release body is the tag's own CHANGELOG section, verbatim. A tag with no
          # section is refused: an unexplained release is a release nobody can review.
          python3 - "$TAG" "$RUNNER_TEMP/release-notes.md" <<'EOF'
          import re, sys
          version, out = sys.argv[1][1:], sys.argv[2]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(r"(?ms)^## " + re.escape(version) + r"\b.*?(?=^## |\Z)", text)
          if not m:
              sys.exit(f"CHANGELOG.md has no '## {version}' section; refusing to release")
          open(out, "w", encoding="utf-8").write(m.group(0).rstrip() + "\n")
          EOF
      - name: Attest build provenance
        # The .sha256 sidecar only detects corruption; it proves nothing about origin
        # because anyone who can replace the archive can replace the hash. This does.
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.build.outputs.archive }}
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # Notes live in RUNNER_TEMP, not dist/, so they are never uploaded as an asset.
          gh release create "$TAG" dist/* \
            --verify-tag \
            --title "Ready Agent 1 $TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
