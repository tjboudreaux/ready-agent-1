name: Agent Readiness

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write   # upload SARIF to code scanning
  actions: read            # upload-sarif + T2 workflow checks need workflow-run reads

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Dogfood the action from main; the user-facing template pins @v1. Deliberately not
      # digest-pinned: the point is to grade every PR with the action as it currently
      # stands on main, and a fork PR cannot alter the action that judges it. Same-repo
      # ref, so this is not third-party supply chain.
      - uses: tjboudreaux/ready-agent-1/ci@main # zizmor: ignore[unpinned-uses]
        id: readiness
        with:
          min-level: "3"
          formats: "markdown,junit,sarif,github"
        env:
          GH_TOKEN: ${{ github.token }}
      # The action writes only to a private RUNNER_TEMP directory; expose what callers
      # need for uploads/notifications without creating consumer-repository report state.
      - name: Upload readiness report artifacts
        if: ${{ steps.readiness.outputs.has-markdown == 'true' }}
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.5
        with:
          name: readiness-report
          path: ${{ steps.readiness.outputs.report-directory }}
          if-no-files-found: error
          retention-days: 7