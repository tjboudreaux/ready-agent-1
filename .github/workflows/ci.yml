name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install dev tools (coverage is dev-only; runtime is pure stdlib)
        run: python3 -m pip install coverage
      - name: Tests with coverage (gate >90% total; per-touched-file gate via coverage_gate)
        run: |
          python3 -m coverage run --branch --source=engine/readiness,evals,scripts,ci -m unittest discover -s tests -t .
          python3 -m coverage json -o .coverage.json
          python3 -m coverage report --fail-under=90
          python3 -m evals.coverage_gate --coverage .coverage.json \
            --release-matrix release/versions.json --out .coverage-touched.json
      - name: Vendored skills byte-parity
        run: python3 scripts/vendor.py --check
      - name: Labeled-fixture evals (per-criterion FP/FN gate)
        run: python3 -m evals.fixtures
      - name: Parity vs Factory reference shapes (offline)
        run: python3 -m evals.parity
      - name: Criterion-label corpus validation
        run: python3 -m evals.criterion_benchmark --validate evals/criterion_labels.json
      - name: Release-version matrix parity
        run: python3 scripts/check_release_versions.py

  windows-compat:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      # Windows is NOT a supported operational platform: parser help/version/formats/banner
      # must still work, and one operational command must fail closed with the exact
      # supported-platform diagnostic before any repository access or subprocess.
      #
      # Both steps run under bash (GitHub invokes it with -e -o pipefail), so every command
      # is gated individually. The pwsh default only reports the LAST command's exit code,
      # which let a crashing `banner` pass unnoticed, and pwsh's `2>&1` on a native command
      # under $ErrorActionPreference=stop aborts the step without printing anything.
      - name: Parser surfaces work on Windows
        shell: bash
        run: |
          python3 engine/readiness/cli.py version
          python3 engine/readiness/cli.py formats
          python3 engine/readiness/cli.py banner
          python3 engine/readiness/cli.py --help
      - name: Operational commands fail closed on Windows
        shell: bash
        run: |
          if output="$(python3 engine/readiness/cli.py detect 2>&1)"; then
            echo "detect must fail closed on Windows" >&2
            exit 1
          fi
          echo "$output"
          case "$output" in
            *safe_io_unsupported*) ;;
            *) echo "expected exact safe_io_unsupported diagnostic" >&2; exit 1 ;;
          esac

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Ruff (full configured ruleset)
        run: |
          python3 -m pip install 'ruff==0.16.1'
          python3 -m ruff check --no-cache engine scripts evals tests
      - name: Zizmor (workflow + action SAST)
        run: |
          python3 -m pip install 'zizmor==1.29.0'
          zizmor --no-progress --persona=regular .github/workflows/ ci/action.yml
      - name: Zizmor (shipped workflow templates)
        run: |
          staged="$(mktemp -d)/.github/workflows"
          mkdir -p "$staged"
          cp templates/ci/*.yml "$staged/"
          zizmor --no-progress --persona=regular --config .github/zizmor-templates.yml "$staged"
      # Bandit lives in .github/workflows/security.yml, not here: one gate, one place.