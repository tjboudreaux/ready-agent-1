name: Ready Agent 1

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write   # upload SARIF to code scanning
  actions: read            # upload-sarif + T2 workflow checks need workflow-run reads

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          # The readiness scan only reads the tree; it never pushes. Leaving the token in
          # .git/config would expose it to every later step and to anything that archives
          # the workspace.
          persist-credentials: false
      - uses: tjboudreaux/ready-agent-1/ci@v1
        with:
          min-level: "3"
          formats: "markdown,junit,sarif,github"
        env:
          GH_TOKEN: ${{ github.token }}
