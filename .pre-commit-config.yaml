repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
      - id: check-merge-conflict
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      # No --select override, matching .github/workflows/ci.yml: both defer to the ruleset in
      # pyproject.toml. Kept in sync deliberately -- a hook stricter than CI trains
      # contributors to skip hooks, and a looser one lets CI fail on what the hook allowed.
      - id: ruff
        args: ["--no-cache"]
