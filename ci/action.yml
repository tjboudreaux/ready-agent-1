name: "Ready Agent 1"
description: "Run the Ready Agent 1 engine, publish a readiness report, and gate on a minimum level."
branding:
  icon: "check-circle"
  color: "green"
inputs:
  project:
    description: "Path to the repository to analyze"
    required: false
    default: "."
  min-level:
    description: "Fail the job if the readiness level is below this (1-5)"
    required: false
    default: "3"
  formats:
    description: "Comma-separated report formats"
    required: false
    default: "markdown,junit,sarif,github"
  upload-sarif:
    description: "Upload SARIF to GitHub code scanning"
    required: false
    default: "true"
runs:
  using: "composite"
  # Inputs are NEVER interpolated directly into `run:` blocks. This action is consumed by
  # other repositories, and callers routinely wire inputs from untrusted sources (PR
  # titles, branch names, issue bodies). Direct ${{ }} expansion would substitute that
  # text into the shell before any quoting could contain it -- injection in the caller's
  # pipeline. Everything crosses the boundary through env instead.
  steps:
    - name: Run readiness engine (deterministic)
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        PROJECT: ${{ inputs.project }}
        FORMATS: ${{ inputs.formats }}
      run: |
        python3 "$ACTION_PATH/../engine/readiness/cli.py" report \
          --project "$PROJECT" \
          --format "$FORMATS" \
          --out "$PROJECT/.agents/readiness"
        echo "report written"
    - name: Publish job summary
      shell: bash
      env:
        PROJECT: ${{ inputs.project }}
      run: |
        if [ -f "$PROJECT/.agents/readiness/report.md" ]; then
          cat "$PROJECT/.agents/readiness/report.md" >> "$GITHUB_STEP_SUMMARY"
        fi
    - name: Upload SARIF
      if: ${{ inputs.upload-sarif == 'true' && hashFiles(format('{0}/.agents/readiness/report.sarif', inputs.project)) != '' }}
      # Best-effort: code scanning is unavailable on private repos without GHAS;
      # the readiness gate is the report + min-level step, not this upload.
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@d1ba80a13dd99fba24a470575428917156a28b43 # v4.37.5
      with:
        sarif_file: "${{ inputs.project }}/.agents/readiness/report.sarif"
    - name: Gate on minimum level
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        PROJECT: ${{ inputs.project }}
        MIN_LEVEL: ${{ inputs.min-level }}
      run: |
        case "$MIN_LEVEL" in
          [1-5]) ;;
          *) echo "min-level must be 1-5, got '$MIN_LEVEL'" >&2; exit 1 ;;
        esac
        python3 "$ACTION_PATH/../engine/readiness/cli.py" report \
          --project "$PROJECT" --format json \
          --min-level "$MIN_LEVEL" > /dev/null
