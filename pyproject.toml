[project]
name = "agent-readiness"
version = "0.11.0"
description = "Score a repository's readiness for AI agents and remediate the gaps."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Travis Boudreaux" }]
# Runtime is pure standard library — intentionally no dependencies.
dependencies = []

[project.scripts]
ra1 = "readiness.cli:main"

[tool.setuptools]
package-dir = { "" = "engine" }
packages = ["readiness", "readiness.checks", "readiness.collectors", "readiness.fix"]

[tool.setuptools.package-data]
readiness = ["criteria/*.json"]

# Dev tooling is declared in [dependency-groups] and locked via uv.lock so `uv run`
# automatically installs and resolves the pinned ruff version across environments.

[tool.ruff]
# Older ruff cannot parse [tool.ruff.lint] and exits with a TOML error rather than a
# finding, so an unpinned contributor would silently lint nothing. Fail loudly instead.
required-version = ">=0.6.0"
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# NOTE: strict typing is an aspiration, not a gate. `mypy engine/readiness` currently
# reports ~1045 errors (mostly no-untyped-def), so CI enforces ruff (the full ruleset
# above) and not mypy. Do not describe this repo as strictly typed until that count is zero.
[tool.mypy]
python_version = "3.11"
strict = true

[tool.coverage.run]
branch = true
source = ["engine/readiness", "evals", "scripts"]

[tool.coverage.report]
show_missing = true

[dependency-groups]
dev = [
    "ruff==0.16.1",
]
